<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1c2b36;--muted:#5b6872;--line:#d6dbd8;--accent:#1f5f7a;--accent-soft:#e3eef2;--gold:#b97d1e;--ok:#2f7a4b;--ok-soft:#e2f2e7;--bad:#a83a32;--bad-soft:#f7e3e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a1f;--card:#1b242b;--ink:#e4e9ec;--muted:#9aa7b0;--line:#2e3a43;--accent:#6fb3cf;--accent-soft:#1d3440;--gold:#e3a64a;--ok:#6cc08b;--ok-soft:#1b3326;--bad:#e3847b;--bad-soft:#3d2321;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131a1f;--card:#1b242b;--ink:#e4e9ec;--muted:#9aa7b0;--line:#2e3a43;--accent:#6fb3cf;--accent-soft:#1d3440;--gold:#e3a64a;--ok:#6cc08b;--ok-soft:#1b3326;--bad:#e3847b;--bad-soft:#3d2321;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

header{display:flex;gap:12px;align-items:center;margin-bottom:18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;margin-bottom:14px}

label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.box.mine{background:var(--bg)}.box.ref{background:var(--accent-soft);border-color:var(--accent)}

.okbox{background:var(--ok-soft);border-color:var(--ok)}.badbox{background:var(--bad-soft);border-color:var(--bad)}

button.chip.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
button.course{display:grid;gap:4px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);font-weight:400;padding:14px 16px}
button.course:hover{border-color:var(--accent)}

.tag{display:inline-block;font-size:.75rem;color:var(--gold);font-weight:600}

<script>
/* =====================================================================
   COURS : pour ajouter un cours, copier un bloc { ... } et l'adapter.
   cards : [question, réponse, numéro de partie]
   quiz  : [question, [choix...], index de la bonne réponse, explication, numéro de partie]

var COURSES=[
{"id": "socio-sante", "titre": "Sociologie de la santé", "enseignant": "Prof. DJOUDA", "semestre": "Semestre 1", "maj": "21/10/2026", "seances": "Cours des 19, 20 et 21 octobre 2026 · cours complet", "parties": {"1": "Partie 1 : concepts majeurs", "2": "Partie 2 : approches théoriques", "3": "Partie 3 : Journey Map", "4": "Partie 4 : application aux cas"}, "cards": [["Quel est l'objet de la sociologie de la santé ?", "Le fait social : l'ensemble des manières de faire, de sentir et d'agir socialement ou politiquement construites autour de la maladie ou de la santé.", 1], ["Sur quoi repose la légitimité de la sociologie dans le champ de la santé ?", "Sur le fait que la santé est un phénomène multidimensionnel : à la fois biomédical, social, culturel, économique, politique et même religieux.", 1], ["Sur le plan de la santé, comment le cours définit-il l'être humain ?", "Comme un être bio-psycho-social : son état de santé dépend dans une large mesure du milieu social où il vit.", 1], ["Quels sont les cinq concepts majeurs étudiés dans la première partie du cours ?", "Santé, maladie, accessibilité aux soins, croyances étiologiques, trajectoires thérapeutiques.", 1], ["Que sont les croyances étiologiques ?", "L'ensemble des idées que les personnes développent autour d'une maladie (sur son origine) ; elles se confondent avec les représentations sociales de la maladie.", 1], ["Quel lien existe-t-il entre croyances étiologiques et trajectoire thérapeutique ?", "Une corrélation, une influence : la cause attribuée à la maladie oriente les recours choisis par le malade et son entourage.", 1], ["Quelles sont les dimensions de l'accessibilité aux soins vues en cours ?", "Socioculturelle, économique, financière, géographique (les patients peuvent-ils arriver jusqu'à la formation sanitaire ?) et physique.", 1], ["Qui a formulé la première analyse sociologique de la maladie et de la médecine, définissant le rôle social du médecin et celui du malade ?", "Le sociologue américain Talcott Parsons, en 1948 selon Adam et Herzlich (1994).", 1], ["Quand et par quels organismes a été organisé le premier colloque de sociologie médicale en France ?", "En juillet 1976, par le CNRS et l'INSERM.", 1], ["Citez trois sociologues dont les travaux ont nourri la sociologie de la santé dans les années 1960-1980.", "Au choix : Merton, Hughes, Fox, Becker, Goffman, Chauvenet, Freidson, Strauss.", 1], ["Quels facteurs expliquent l'essor récent des travaux de sociologie de la santé ?", "Le financement d'études par les pouvoirs publics, la société civile et les organismes nationaux et internationaux (UNICEF, OMS…), et l'émergence des grandes pandémies et crises sanitaires (sida, cancers, maladies chroniques, catastrophes sanitaires) qui ont mis à l'épreuve la biomédecine.", 1], ["Que soulignent Carricaburu et Ménoret (2004) à propos de la maladie ?", "Que personne ne saurait aujourd'hui contester l'idée selon laquelle toute maladie a sa part de social.", 1], ["Selon Sossie Andezian (1987), de quoi dépend la manière dont un groupe explique la santé et la maladie ?", "De sa représentation du monde, de la vie et de la mort, de son système de croyances et de valeurs, de son rapport à l'environnement et de son univers relationnel.", 1], ["Citez quatre domaines de recherche de la sociologie de la santé.", "Au choix : représentations socioculturelles de la maladie, de la santé et du handicap ; prévention des maladies ; déterminants sociaux de la santé ; politiques publiques de santé ; inégalités de santé ; systèmes de santé et leurs réformes ; médecines et soignants parallèles ; accessibilité aux services ; toxicomanie ; lutte contre le sida.", 1], ["En biomédecine, la maladie est une altération physiologique causée par des microbes, virus ou bactéries. Autour de quoi peut-elle aussi être socialement construite ?", "Autour d'entités extérieures à l'organisme humain : sorcellerie, ancêtres, Dieu…", 1], ["Quels sont les trois objectifs du cours de sociologie de la santé ?", "Donner quelques approches théoriques et conceptuelles de base de la santé ; apprendre à interpréter les politiques de santé ; comprendre les objets et les domaines de recherche de la sociologie de la santé.", 1], ["Que recouvre la dimension physique de l'accessibilité aux soins ?", "L'accès pour les personnes handicapées, l'état des bâtiments et l'état des routes.", 1], ["Pourquoi les sociologues ont-ils longtemps été tenus à l'écart du champ de la santé ?", "Parce que le savoir médical était réservé aux spécialistes.", 1], ["À quelle période la sociologie de la santé s'émancipe-t-elle, selon Carricaburu et Ménoret (2004) ?", "Dans les années 1950.", 1], ["Complément hors cours : qu'est-ce que le « rôle de malade » décrit par Parsons ?", "Le malade est dispensé de ses obligations ordinaires et n'est pas tenu pour responsable de son état, mais il doit vouloir guérir et consulter un médecin.", 1], ["De quelle discipline est issue l'approche étiologico-thérapeutique ?", "De l'anthropologie médicale.", 2], ["Que permet de comprendre l'approche étiologico-thérapeutique ?", "À la fois l'étiologie subjective des malades et la sémiologie collective ou populaire de la maladie dans les communautés.", 2], ["Pourquoi dit-on que l'approche étiologico-thérapeutique donne accès au vécu « du dedans » ?", "Parce qu'elle donne accès aux affects et aux sentiments vécus par les malades, que l'on ne peut pas lire « du dehors ».", 2], ["Que permet d'observer l'approche étiologico-thérapeutique à l'hôpital ?", "Comment les soignants gèrent ou intègrent les croyances, les attitudes et les pratiques des malades dans le diagnostic et le traitement.", 2], ["Résumez en une phrase l'apport de l'approche étiologico-thérapeutique.", "Elle permet de comprendre la maladie telle qu'elle est imaginée, fantasmée, représentée, vécue et prise en charge par les malades, les soignants et l'entourage.", 2], ["Comment un soignant peut-il intégrer l'étiologie subjective du malade (par exemple la croyance en la sorcellerie) sans cautionner des pratiques qui retardent le traitement, comme dans le cas de Mme Y ?", "En dialoguant avec le malade, en avançant avec prudence et en l'amenant progressivement à prendre de la distance avec les croyances qui retardent sa prise en charge.", 2], ["Donnez la définition de l'approche centrée sur le patient selon Du Jardin (2003, p. 289).", "« Mettre la personne du patient au centre de la consultation et essayer de comprendre ses pensées, sentiments et attentes, tout autant que ses symptômes. »", 2], ["Pourquoi l'approche des soins centrée sur le patient est-elle importante ?", "Parce que la santé ne se réduit pas aux aspects biomédicaux : les aspects psychosociaux et les autres déterminants (culturels, économiques, environnementaux, politiques…) font partie des préoccupations des professionnels de santé.", 2], ["Quel est l'avantage de l'approche centrée sur le patient pour les services de santé ?", "Elle recentre la qualité des soins et le fonctionnement des services sur les attentes et les besoins des patients. Elle prend aussi en compte les attentes des prestataires de soins.", 2], ["Quel changement de paradigme l'approche centrée sur le patient exige-t-elle du prestataire ?", "Au lieu de penser et de répondre seulement en termes de maladie et de pathologie, il doit chercher à comprendre le malade, ses attitudes et ses pratiques, et le considérer dans sa personnalité totale ou multidimensionnelle.", 2], ["Sur quoi l'approche centrée sur le patient met-elle un point d'honneur ?", "Sur le respect de la liberté du malade, de sa dignité et de son système de valeurs ou de croyances.", 2], ["Quelles sont les cinq dimensions de l'approche centrée sur le patient (Mead et Bower, 2000) ?", "1. La dimension bio-psycho-sociale ; 2. le patient comme personne à part entière ; 3. le partage du pouvoir et des responsabilités ; 4. l'alliance thérapeutique ; 5. le soignant comme personne à part entière.", 2], ["Que signifie la dimension « partage du pouvoir et des responsabilités » ?", "Le patient prend part à la décision et partage avec les soignants les responsabilités de sa prise en charge.", 2], ["Qu'est-ce que l'alliance thérapeutique ?", "Un langage commun entre soignants et patients, qui inclut les aspects socio-émotionnels et une relation d'empathie.", 2], ["Que signifie la dimension « patient comme personne à part entière » ?", "Les soins sont adaptés à sa personnalité et tiennent compte de ses représentations individuelles de la maladie.", 2], ["Que signifie la dimension « soignant comme personne à part entière » ?", "La personnalité et les attentes du soignant influencent la façon dont les soins sont donnés.", 2], ["Citez les avantages de l'approche bio-psycho-sociale des soins.", "Elle « ré-humanise » la médecine ; elle fait du patient un acteur de sa prise en charge ; elle prend en compte sa liberté, sa dignité, ses valeurs, ses attitudes, ses attentes et ses croyances ; elle serait le modèle idéal de la pratique médicale ; ses habiletés humaines favorisent une prise en charge holistique et plus efficace.", 2], ["Quelles habiletés professionnelles humaines l'approche bio-psycho-sociale mobilise-t-elle ?", "L'écoute, la communication, la participation du patient aux décisions et l'ouverture des soignants aux aspects psychosociaux.", 2], ["Quels sont les quatre niveaux d'influence du modèle socio-écologique ?", "Le niveau individuel (intrapersonnel), le niveau interpersonnel, le niveau communautaire et le niveau politique et structurel.", 2], ["Que regroupe le niveau individuel du modèle socio-écologique ?", "Les connaissances, les compétences, les valeurs et croyances, la confiance dans sa propre efficacité, la perception des normes et des risques, les émotions, ainsi que les ressources financières et l'âge.", 2], ["Que regroupe le niveau interpersonnel du modèle socio-écologique ?", "Les relations avec la famille, les amis et les pairs : influence des pairs, communication entre conjoints, influence du conjoint et de la famille, soutien social.", 2], ["Que regroupe le niveau communautaire du modèle socio-écologique ?", "Les normes sociales, les relations entre organisations (communautaires, lieux de culte, milieux de vie), les institutions et réseaux informels : leadership, accès à l'information, capital social, efficacité collective.", 2], ["Que regroupe le niveau politique et structurel du modèle socio-écologique ?", "Les politiques publiques (nationales, régionales, départementales, locales), les lois et règlements, les ressources et services, les protocoles, les valeurs religieuses et culturelles, les normes de genre, les médias et l'équité de revenu.", 2], ["Quel rôle le schéma du modèle socio-écologique donne-t-il à la communication ?", "Elle sert à surmonter les obstacles aux changements normatifs et sociaux, à tous les niveaux.", 2], ["Comment se présente le schéma du modèle du Journey Map ?", "Comme un 8 renversé (symbole de l'infini) qui décrit le parcours du bénéficiaire vers les services en six étapes, entouré de cercles emboîtés : individu, famille, communauté, systèmes de santé, systèmes politiques.", 3], ["Quelles sont les six étapes du Journey Map ?", "1. Connaissances et sensibilisation ; 2. Intentions ; 3. Préparation, coût et effort ; 4. Lieu de prestation des services ; 5. Expérience des services ; 6. Après service.", 3], ["Selon le professeur, qu'est-ce qui est intéressant à comprendre dans le Journey Map ?", "La nature des hypothèses qu'il permet de formuler pour comprendre les déterminants de la santé.", 3], ["Que documente la première étape du Journey Map (connaissances et sensibilisation) ?", "Les connaissances pratiques, les normes et valeurs, la confiance dans les services et les prestataires, les compétences pratiques et les perceptions (préjugés, peurs, appréhensions) construites par les bénéficiaires ou cibles des services.", 3], ["Quelle est la première hypothèse de travail du Journey Map, selon l'explication du professeur ?", "Pour qu'il y ait une demande de soins, la population doit avoir les connaissances pratiques nécessaires : savoir qu'une FOSA existe, qu'elle est disponible, que les ressources humaines y sont présentes en quantité suffisante. Une population qui n'est pas informée de l'existence d'un service ne peut pas le demander.", 3], ["Que documente la deuxième étape du Journey Map (intentions) ?", "Les pouvoirs et processus de décision, l'auto-efficacité, les niveaux de motivation et de satisfaction, la reconnaissance sociale, le respect de la communauté et de ses valeurs.", 3], ["Quel lien le professeur établit-il entre la première et la deuxième étape du Journey Map ?", "Lorsque la première étape est satisfaite (la population est informée), on peut mûrir ou provoquer chez la communauté l'intention de recourir au service. Exemple : on ne demande pas les services de kiné d'une FOSA si l'on n'en a pas une bonne connaissance.", 3], ["Qu'observe-t-on à la troisième étape du Journey Map (préparation, coût et effort) ?", "La préparation, le transport pour se rendre aux services, la façon dont les acteurs (parents et enfants) arbitrent entre des priorités concurrentes, les coûts sociaux et d'opportunité. Selon le professeur, elle repose sur la question financière et sur l'effort financier et de temps.", 3], ["Qu'analyse-t-on aux étapes 4 et 5 du Journey Map (lieu et expérience des services) ?", "La pertinence (disposition) et la commodité des services, les heures de service, la distance sociale, la formation et la capacité des prestataires, leur charge de travail.", 3], ["Quelle question sensible se pose à l'étape 4 du Journey Map, selon l'exemple du professeur ?", "Une personne a été informée d'un centre de kiné efficace, a eu l'intention d'y aller et a mobilisé ses ressources et son temps : au lieu de prestation, la prise en charge doit être en adéquation avec ses attentes.", 3], ["Comment les étapes 4 et 5 du Journey Map sont-elles liées ?", "L'étape 4 (lieu de prestation) va avec l'étape 5, où le bénéficiaire vit l'expérience des services.", 3], ["Que permet de comprendre l'étape 6 du Journey Map (après service) ?", "Le prolongement des interactions entre les prestataires et les bénéficiaires après les services, c'est-à-dire le suivi.", 3], ["Pourquoi dit-on que le parcours du Journey Map n'est pas linéaire ?", "Parce que l'expérience vécue dans les services (étapes 4 à 6) se répercute sur les connaissances et les intentions (étapes 1 et 2) pour les recours suivants ; le schéma en 8 et les flèches en pointillés traduisent cette boucle.", 3], ["Quel est l'intérêt pratique du Journey Map pour un gestionnaire de programme de santé ?", "Repérer à quelle étape du parcours se situent les obstacles (connaissances, décision, coût, accueil, suivi) pour agir à cette étape précise plutôt que sur l'offre de soins seule.", 3], ["Quels liens existent entre le Journey Map et le modèle socio-écologique ?", "Les cercles qui entourent le 8 (individu, famille, communauté, systèmes de santé, systèmes politiques) reprennent les niveaux d'influence du modèle socio-écologique : chaque étape du parcours est influencée par ces différents niveaux.", 3], ["Quelles grandes notions le cours de sociologie de la santé a-t-il abordées ?", "Les concepts majeurs (santé, maladie, accessibilité aux soins, croyances étiologiques, trajectoires thérapeutiques), l'histoire, la légitimité, l'objet et le champ d'investigation de la sociologie de la santé, puis les approches théoriques : approche étiologico-thérapeutique, approche centrée sur le patient, modèle socio-écologique, Journey Map.", 4], ["Quelle méthode le professeur attend-il dans les exercices ?", "Faire un va-et-vient entre les éléments théoriques du cours et l'exemple pratique, c'est-à-dire mobiliser le bagage théorique donné en cours pour analyser le cas, et non résumer le texte.", 4], ["Quel outil du cours permet d'analyser les croyances étiologiques et la trajectoire thérapeutique d'une malade comme Mme Y ?", "L'approche étiologico-thérapeutique : elle permet de comprendre l'étiologie subjective de la malade, la sémiologie populaire de son entourage, et la façon dont ces croyances orientent ses recours successifs.", 4], ["Comment le modèle socio-écologique éclaire-t-il les choix thérapeutiques de Mme Y ?", "Ses choix ne relèvent pas seulement de son niveau individuel (croyances, ressources) : le niveau interpersonnel (mari, famille), le niveau communautaire (village, guérisseurs, Église, personne-relais) et le niveau politique et structurel (offre et coût des soins) interviennent aussi.", 4], ["À quelles étapes du Journey Map se situent les principales difficultés de Mme Y ?", "Surtout aux étapes 1 à 3 : connaissances et croyances sur la maladie, décisions prises par l'entourage, coûts et efforts importants des recours successifs avant l'arrivée à l'hôpital.", 4], ["Quel cadre du cours permet d'évaluer une consultation comme celle du Dr I ?", "L'approche des soins centrée sur le patient, avec ses cinq dimensions (Mead et Bower, 2000) : dimension bio-psycho-sociale, patient comme personne, partage du pouvoir et des responsabilités, alliance thérapeutique, soignant comme personne.", 4], ["À quelles étapes du Journey Map se situe la consultation du Dr I ?", "Aux étapes 4 et 5 (lieu et expérience des services) : qualité de l'écoute, interruptions, distance sociale, prise en compte des contraintes du malade.", 4], ["Citez des comportements d'un soignant contraires à l'approche centrée sur le patient.", "Interrompre le malade, ne pas l'examiner, décider seul des examens sans tenir compte de ses moyens, ignorer ses préoccupations, accorder un traitement de faveur à d'autres personnes en sa présence.", 4]], "quiz": [["Sur quoi repose la légitimité de la sociologie dans le champ de la santé ?", ["La santé est un phénomène multidimensionnel : biomédical, social, culturel, économique, politique et même religieux", "La médecine ne parvient plus à soigner les maladies chroniques", "Les socio rs socioculturel à l'autre.", 1], ["De quelle discipline est issue l'approche étiologico-thérapeutique ?", ["La psychologie clinique", "L'anthropologie médicale", "L'épidémiologie", "L'économie de la santé"], 1, "Le cours la présente comme un modèle issu de l'anthropologie médicale.", 2], ["L'approche étiologico-thérapeutique permet de comprendre à la fois :", ["Le coût des traitements et leur efficacité", "L'étiologie subjective des malades et la sémiologie collective ou populaire de la maladie", "Le diagnostic médical et le pronostic", "Les politiques de santé et leur financement"], 1, "Elle articule le point de vue du malade et celui de sa communauté.", 2], ["Selon Du Jardin (2003), l'approche centrée sur le patient consiste à :", ["Réduire la durée des consultations", "Mettre la personne du patient au centre de la consultation et comprendre ses pensées, sentiments et attentes, tout autant que ses symptômes", "Laisser le patient choisir seul son traitement", "Soigner d'abord les patients les plus graves"], 1, "Définition citée en cours : Du Jardin, 2003, p. 289.", 2], ["Laquelle de ces propositions n'est pas l'une des cinq dimensions de Mead et Bower (2000) ?", ["L'alliance thérapeutique", "Le partage du pouvoir et des responsabilités", "La rentabilité de la consultation", "Le soignant comme personne à part entière"], 2, "Les cinq dimensions : bio-psycho-sociale, patient comme personne, partage du pouvoir, alliance thérapeutique, soignant comme personne.", 2], ["L'alliance thérapeutique désigne :", ["Un contrat écrit entre le patient et l'hôpital", "Un langage commun entre soignants et patients, avec des aspects socio-émotionnels et une relation d'empathie", "L'association de plusieurs médicaments", "La collaboration entre médecins de spécialités différentes"], 1, "C'est la quatrième dimension de l'approche centrée sur le patient.", 2], ["Quel changement l'approche centrée sur le patient demande-t-elle au prestataire ?", ["Penser uniquement en termes de pathologie", "Considérer le malade dans sa personnalité totale ou multidimensionnelle", "Déléguer toutes les décisions à la famille", "Prescrire davantage d'examens"], 1, "Le cours parle d'un véritable changement de paradigme.", 2], ["Selon le cours, l'approche bio-psycho-sociale des soins :", ["« Ré-humanise » la médecine en replaçant le patient au centre", "Remplace la biomédecine", "Concerne seulement les maladies mentales", "Réduit le rôle du patient"], 0, "Elle fait aussi du patient un véritable acteur de sa prise en charge.", 2], ["Combien de niveaux d'influence compte le modèle socio-écologique vu en cours ?", ["Deux", "Trois", "Quatre", "Six"], 2, "Individuel, interpersonnel, communautaire, politique et structurel.", 2], ["À quel niveau du modèle socio-écologique se situe l'influence du conjoint et de la famille ?", ["Individuel", "Interpersonnel", "Communautaire", "Politique et structurel"], 1, "Le niveau interpersonnel regroupe la famille, les amis, les pairs et le soutien social.", 2], ["Les lieux de culte, le capital social et le leadership relèvent de quel niveau ?", ["Individuel", "Interpersonnel", "Communautaire", "Politique et structurel"], 2, "Le niveau communautaire regroupe normes sociales, organisations et réseaux informels.", 2], ["Les normes de genre, les médias et l'équité de revenu relèvent de quel niveau ?", ["Individuel", "Interpersonnel", "Communautaire", "Politique et structurel"], 3, "Le niveau politique et structurel inclut aussi les lois, règlements et protocoles.", 2], ["Face à un malade qui attribue sa maladie à la sorcellerie, l'attitude recommandée en cours est de :", ["Refuser de le soigner tant qu'il garde ses croyances", "Se moquer de ses croyances pour le convaincre", "Dialoguer, avancer avec prudence et l'amener progressivement à s'éloigner des pratiques qui retardent le traitement", "Le renvoyer vers un tradipraticien"], 2, "Réponse issue de la discussion en cours à propos du cas de Mme Y.", 2], ["Que recouvre la dimension physique de
